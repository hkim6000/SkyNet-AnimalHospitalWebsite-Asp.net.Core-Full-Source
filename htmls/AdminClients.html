<div class="cl-site cl-admin" id="cl-site" data-open="{plhd_open}" data-new="{plhd_new}" data-theme="light" style="{plhd_style}">
<header class="cl-ahead">
    <button type="button" class="cl-ibtn cl-burger" aria-label="Menu" onclick="AdminClientsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="cl-abrand" href="Admin"><svg class="cl-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--cl-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="cl-demo" id="cl-demo">{plhd_demo}</span>
    <span class="cl-grow"></span>
    <a class="cl-who" id="cl-who" href="AdminAccount"></a>
    <a class="cl-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="cl-out" onclick="AdminClientsJs.signOut()">Sign out</button>
</header>
<aside class="cl-side" id="cl-nav" aria-label="Admin">
    <div class="cl-nav-top"><span>Menu</span><button type="button" class="cl-ibtn" aria-label="Close" onclick="AdminClientsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="cl-menu" id="cl-menu"></nav>
</aside>
<div class="cl-scrim" id="cl-scrim" onclick="AdminClientsJs.closeNav()"></div>
<main class="cl-amain" id="cl-main"><p class="cl-loading">Loading&hellip;</p></main>
<div class="cl-modal" id="cl-modal" onclick="if(event.target===this)AdminClientsJs.closeModal()">
    <div class="cl-mbox" role="dialog" aria-modal="true"><button type="button" class="cl-ibtn cl-mclose" aria-label="Close" onclick="AdminClientsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="cl-mbody"></div></div>
</div>
<div class="cl-toast" id="cl-toast" role="status" aria-live="polite"></div>
</div>
