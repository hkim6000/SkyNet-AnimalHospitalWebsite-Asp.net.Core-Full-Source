<div class="al-site al-admin" id="al-site" data-qs="{plhd_qs}" data-theme="light" style="{plhd_style}">
<header class="al-ahead">
    <button type="button" class="al-ibtn al-burger" aria-label="Menu" onclick="AdminActivityJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="al-abrand" href="Admin"><svg class="al-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--al-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="al-demo" id="al-demo">{plhd_demo}</span>
    <span class="al-grow"></span>
    <a class="al-who" id="al-who" href="AdminAccount"></a>
    <a class="al-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="al-out" onclick="AdminActivityJs.signOut()">Sign out</button>
</header>
<aside class="al-side" id="al-nav" aria-label="Admin">
    <div class="al-nav-top"><span>Menu</span><button type="button" class="al-ibtn" aria-label="Close" onclick="AdminActivityJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="al-menu" id="al-menu"></nav>
</aside>
<div class="al-scrim" id="al-scrim" onclick="AdminActivityJs.closeNav()"></div>
<main class="al-amain" id="al-main"><p class="al-loading">Loading&hellip;</p></main>
<div class="al-modal" id="al-modal" onclick="if(event.target===this)AdminActivityJs.closeModal()">
    <div class="al-mbox" role="dialog" aria-modal="true"><button type="button" class="al-ibtn al-mclose" aria-label="Close" onclick="AdminActivityJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="al-mbody"></div></div>
</div>
<div class="al-toast" id="al-toast" role="status" aria-live="polite"></div>
</div>
