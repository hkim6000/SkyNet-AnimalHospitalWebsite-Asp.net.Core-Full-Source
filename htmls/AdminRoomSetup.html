<div class="ro-site ro-admin" id="ro-site" data-theme="light" style="{plhd_style}">
<header class="ro-ahead">
    <button type="button" class="ro-ibtn ro-burger" aria-label="Menu" onclick="AdminRoomSetupJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ro-abrand" href="Admin"><svg class="ro-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--ro-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="ro-demo" id="ro-demo">{plhd_demo}</span>
    <span class="ro-grow"></span>
    <a class="ro-who" id="ro-who" href="AdminAccount"></a>
    <a class="ro-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ro-out" onclick="AdminRoomSetupJs.signOut()">Sign out</button>
</header>
<aside class="ro-side" id="ro-nav" aria-label="Admin">
    <div class="ro-nav-top"><span>Menu</span><button type="button" class="ro-ibtn" aria-label="Close" onclick="AdminRoomSetupJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="ro-menu" id="ro-menu"></nav>
</aside>
<div class="ro-scrim" id="ro-scrim" onclick="AdminRoomSetupJs.closeNav()"></div>
<main class="ro-amain" id="ro-main"><p class="ro-loading">Loading&hellip;</p></main>
<div class="ro-modal" id="ro-modal" onclick="if(event.target===this)AdminRoomSetupJs.closeModal()">
    <div class="ro-mbox" role="dialog" aria-modal="true"><button type="button" class="ro-ibtn ro-mclose" aria-label="Close" onclick="AdminRoomSetupJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ro-mbody"></div></div>
</div>
<div class="ro-toast" id="ro-toast" role="status" aria-live="polite"></div>
</div>
