<div class="rm-site rm-admin" id="rm-site" data-open="{plhd_open}" data-theme="light" style="{plhd_style}">
<header class="rm-ahead">
    <button type="button" class="rm-ibtn rm-burger" aria-label="Menu" onclick="AdminRemindersJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="rm-abrand" href="Admin"><svg class="rm-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--rm-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="rm-demo" id="rm-demo">{plhd_demo}</span>
    <span class="rm-grow"></span>
    <a class="rm-who" id="rm-who" href="AdminAccount"></a>
    <a class="rm-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="rm-out" onclick="AdminRemindersJs.signOut()">Sign out</button>
</header>
<aside class="rm-side" id="rm-nav" aria-label="Admin">
    <div class="rm-nav-top"><span>Menu</span><button type="button" class="rm-ibtn" aria-label="Close" onclick="AdminRemindersJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="rm-menu" id="rm-menu"></nav>
</aside>
<div class="rm-scrim" id="rm-scrim" onclick="AdminRemindersJs.closeNav()"></div>
<main class="rm-amain" id="rm-main"><p class="rm-loading">Loading&hellip;</p></main>
<div class="rm-modal" id="rm-modal" onclick="if(event.target===this)AdminRemindersJs.closeModal()">
    <div class="rm-mbox" role="dialog" aria-modal="true"><button type="button" class="rm-ibtn rm-mclose" aria-label="Close" onclick="AdminRemindersJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rm-mbody"></div></div>
</div>
<div class="rm-toast" id="rm-toast" role="status" aria-live="polite"></div>
</div>
