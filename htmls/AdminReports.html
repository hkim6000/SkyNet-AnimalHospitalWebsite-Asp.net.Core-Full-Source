<div class="rp-site rp-admin" id="rp-site" data-theme="light" style="{plhd_style}">
<header class="rp-ahead">
    <button type="button" class="rp-ibtn rp-burger" aria-label="Menu" onclick="AdminReportsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="rp-abrand" href="Admin"><svg class="rp-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--rp-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="rp-demo" id="rp-demo">{plhd_demo}</span>
    <span class="rp-grow"></span>
    <a class="rp-who" id="rp-who" href="AdminAccount"></a>
    <a class="rp-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="rp-out" onclick="AdminReportsJs.signOut()">Sign out</button>
</header>
<aside class="rp-side" id="rp-nav" aria-label="Admin">
    <div class="rp-nav-top"><span>Menu</span><button type="button" class="rp-ibtn" aria-label="Close" onclick="AdminReportsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="rp-menu" id="rp-menu"></nav>
</aside>
<div class="rp-scrim" id="rp-scrim" onclick="AdminReportsJs.closeNav()"></div>
<main class="rp-amain" id="rp-main"><p class="rp-loading">Loading&hellip;</p></main>
<div class="rp-modal" id="rp-modal" onclick="if(event.target===this)AdminReportsJs.closeModal()">
    <div class="rp-mbox" role="dialog" aria-modal="true"><button type="button" class="rp-ibtn rp-mclose" aria-label="Close" onclick="AdminReportsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rp-mbody"></div></div>
</div>
<div class="rp-toast" id="rp-toast" role="status" aria-live="polite"></div>
</div>
