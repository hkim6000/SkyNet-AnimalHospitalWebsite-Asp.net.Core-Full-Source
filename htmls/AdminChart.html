<div class="ch-site ch-admin" id="ch-site" data-open="{plhd_open}" data-theme="light" style="{plhd_style}">
<header class="ch-ahead">
    <button type="button" class="ch-ibtn ch-burger" aria-label="Menu" onclick="AdminChartJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ch-abrand" href="Admin"><svg class="ch-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--ch-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="ch-demo" id="ch-demo">{plhd_demo}</span>
    <span class="ch-grow"></span>
    <a class="ch-who" id="ch-who" href="AdminAccount"></a>
    <a class="ch-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ch-out" onclick="AdminChartJs.signOut()">Sign out</button>
</header>
<aside class="ch-side" id="ch-nav" aria-label="Admin">
    <div class="ch-nav-top"><span>Menu</span><button type="button" class="ch-ibtn" aria-label="Close" onclick="AdminChartJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="ch-menu" id="ch-menu"></nav>
</aside>
<div class="ch-scrim" id="ch-scrim" onclick="AdminChartJs.closeNav()"></div>
<main class="ch-amain" id="ch-main"><p class="ch-loading">Loading&hellip;</p></main>
<div class="ch-modal" id="ch-modal" onclick="if(event.target===this)AdminChartJs.closeModal()">
    <div class="ch-mbox" role="dialog" aria-modal="true"><button type="button" class="ch-ibtn ch-mclose" aria-label="Close" onclick="AdminChartJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ch-mbody"></div></div>
</div>
<div class="ch-toast" id="ch-toast" role="status" aria-live="polite"></div>
</div>
