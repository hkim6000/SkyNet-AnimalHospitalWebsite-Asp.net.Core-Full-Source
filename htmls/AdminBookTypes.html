<div class="bt-site bt-admin" id="bt-site" data-theme="light" style="{plhd_style}">
<header class="bt-ahead">
    <button type="button" class="bt-ibtn bt-burger" aria-label="Menu" onclick="AdminBookTypesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="bt-abrand" href="Admin"><svg class="bt-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--bt-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="bt-demo" id="bt-demo">{plhd_demo}</span>
    <span class="bt-grow"></span>
    <a class="bt-who" id="bt-who" href="AdminAccount"></a>
    <a class="bt-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="bt-out" onclick="AdminBookTypesJs.signOut()">Sign out</button>
</header>
<aside class="bt-side" id="bt-nav" aria-label="Admin">
    <div class="bt-nav-top"><span>Menu</span><button type="button" class="bt-ibtn" aria-label="Close" onclick="AdminBookTypesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="bt-menu" id="bt-menu"></nav>
</aside>
<div class="bt-scrim" id="bt-scrim" onclick="AdminBookTypesJs.closeNav()"></div>
<main class="bt-amain" id="bt-main"><p class="bt-loading">Loading&hellip;</p></main>
<div class="bt-modal" id="bt-modal" onclick="if(event.target===this)AdminBookTypesJs.closeModal()">
    <div class="bt-mbox" role="dialog" aria-modal="true"><button type="button" class="bt-ibtn bt-mclose" aria-label="Close" onclick="AdminBookTypesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="bt-mbody"></div></div>
</div>
<div class="bt-toast" id="bt-toast" role="status" aria-live="polite"></div>
</div>
