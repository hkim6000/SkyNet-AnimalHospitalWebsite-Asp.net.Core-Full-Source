<div class="it-site it-admin" id="it-site" data-theme="light" style="{plhd_style}">
<header class="it-ahead">
    <button type="button" class="it-ibtn it-burger" aria-label="Menu" onclick="AdminItemsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="it-abrand" href="Admin"><svg class="it-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--it-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="it-demo" id="it-demo">{plhd_demo}</span>
    <span class="it-grow"></span>
    <a class="it-who" id="it-who" href="AdminAccount"></a>
    <a class="it-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="it-out" onclick="AdminItemsJs.signOut()">Sign out</button>
</header>
<aside class="it-side" id="it-nav" aria-label="Admin">
    <div class="it-nav-top"><span>Menu</span><button type="button" class="it-ibtn" aria-label="Close" onclick="AdminItemsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="it-menu" id="it-menu"></nav>
</aside>
<div class="it-scrim" id="it-scrim" onclick="AdminItemsJs.closeNav()"></div>
<main class="it-amain" id="it-main"><p class="it-loading">Loading&hellip;</p></main>
<div class="it-modal" id="it-modal" onclick="if(event.target===this)AdminItemsJs.closeModal()">
    <div class="it-mbox" role="dialog" aria-modal="true"><button type="button" class="it-ibtn it-mclose" aria-label="Close" onclick="AdminItemsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="it-mbody"></div></div>
</div>
<div class="it-toast" id="it-toast" role="status" aria-live="polite"></div>
</div>
