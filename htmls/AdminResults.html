<div class="rs-site rs-admin" id="rs-site" data-open="{plhd_open}" data-theme="light" style="{plhd_style}">
<header class="rs-ahead">
    <button type="button" class="rs-ibtn rs-burger" aria-label="Menu" onclick="AdminResultsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="rs-abrand" href="Admin"><svg class="rs-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--rs-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="rs-demo" id="rs-demo">{plhd_demo}</span>
    <span class="rs-grow"></span>
    <a class="rs-who" id="rs-who" href="AdminAccount"></a>
    <a class="rs-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="rs-out" onclick="AdminResultsJs.signOut()">Sign out</button>
</header>
<aside class="rs-side" id="rs-nav" aria-label="Admin">
    <div class="rs-nav-top"><span>Menu</span><button type="button" class="rs-ibtn" aria-label="Close" onclick="AdminResultsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="rs-menu" id="rs-menu"></nav>
</aside>
<div class="rs-scrim" id="rs-scrim" onclick="AdminResultsJs.closeNav()"></div>
<main class="rs-amain" id="rs-main"><p class="rs-loading">Loading&hellip;</p></main>
<div class="rs-modal" id="rs-modal" onclick="if(event.target===this)AdminResultsJs.closeModal()">
    <div class="rs-mbox" role="dialog" aria-modal="true"><button type="button" class="rs-ibtn rs-mclose" aria-label="Close" onclick="AdminResultsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rs-mbody"></div></div>
</div>
<div class="rs-toast" id="rs-toast" role="status" aria-live="polite"></div>
</div>
