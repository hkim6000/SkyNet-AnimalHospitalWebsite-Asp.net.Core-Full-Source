<div class="bl-site bl-admin" id="bl-site" data-qc="{plhd_qc}" data-theme="light" style="{plhd_style}">
<header class="bl-ahead">
    <button type="button" class="bl-ibtn bl-burger" aria-label="Menu" onclick="AdminBalancesJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="bl-abrand" href="Admin"><svg class="bl-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--bl-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="bl-demo" id="bl-demo">{plhd_demo}</span>
    <span class="bl-grow"></span>
    <a class="bl-who" id="bl-who" href="AdminAccount"></a>
    <a class="bl-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="bl-out" onclick="AdminBalancesJs.signOut()">Sign out</button>
</header>
<aside class="bl-side" id="bl-nav" aria-label="Admin">
    <div class="bl-nav-top"><span>Menu</span><button type="button" class="bl-ibtn" aria-label="Close" onclick="AdminBalancesJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="bl-menu" id="bl-menu"></nav>
</aside>
<div class="bl-scrim" id="bl-scrim" onclick="AdminBalancesJs.closeNav()"></div>
<main class="bl-amain" id="bl-main"><p class="bl-loading">Loading&hellip;</p></main>
<div class="bl-modal" id="bl-modal" onclick="if(event.target===this)AdminBalancesJs.closeModal()">
    <div class="bl-mbox" role="dialog" aria-modal="true"><button type="button" class="bl-ibtn bl-mclose" aria-label="Close" onclick="AdminBalancesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="bl-mbody"></div></div>
</div>
<div class="bl-toast" id="bl-toast" role="status" aria-live="polite"></div>
<div class="bl-print" id="bl-print" aria-hidden="true"></div>
</div>
