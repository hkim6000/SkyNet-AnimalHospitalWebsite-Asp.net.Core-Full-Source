<div class="ap-site ap-admin" id="ap-site" data-theme="light" style="{plhd_style}">
<header class="ap-ahead">
    <button type="button" class="ap-ibtn ap-burger" aria-label="Menu" onclick="AdminApptsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ap-abrand" href="Admin"><svg class="ap-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--ap-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="ap-demo" id="ap-demo">{plhd_demo}</span>
    <span class="ap-grow"></span>
    <a class="ap-who" id="ap-who" href="AdminAccount"></a>
    <a class="ap-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ap-out" onclick="AdminApptsJs.signOut()">Sign out</button>
</header>
<aside class="ap-side" id="ap-nav" aria-label="Admin">
    <div class="ap-nav-top"><span>Menu</span><button type="button" class="ap-ibtn" aria-label="Close" onclick="AdminApptsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="ap-menu" id="ap-menu"></nav>
</aside>
<div class="ap-scrim" id="ap-scrim" onclick="AdminApptsJs.closeNav()"></div>
<div id="ap-q" hidden data-a="{plhd_qa}" data-p="{plhd_qp}" data-s="{plhd_qs}" data-d="{plhd_qd}" data-t="{plhd_qt}"></div>
<main class="ap-amain" id="ap-main"><p class="ap-loading">Loading&hellip;</p></main>
<div class="ap-modal" id="ap-modal" onclick="if(event.target===this)AdminApptsJs.closeModal()">
    <div class="ap-mbox" role="dialog" aria-modal="true"><button type="button" class="ap-ibtn ap-mclose" aria-label="Close" onclick="AdminApptsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ap-mbody"></div></div>
</div>
<div class="ap-toast" id="ap-toast" role="status" aria-live="polite"></div>
</div>
