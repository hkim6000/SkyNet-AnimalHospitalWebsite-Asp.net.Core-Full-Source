<div class="pt-site pt-admin" id="pt-site" data-open="{plhd_open}" data-new="{plhd_new}" data-owner="{plhd_owner}" data-theme="light" style="{plhd_style}">
<header class="pt-ahead">
    <button type="button" class="pt-ibtn pt-burger" aria-label="Menu" onclick="AdminPetsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pt-abrand" href="Admin"><svg class="pt-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--pt-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="pt-demo" id="pt-demo">{plhd_demo}</span>
    <span class="pt-grow"></span>
    <a class="pt-who" id="pt-who" href="AdminAccount"></a>
    <a class="pt-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pt-out" onclick="AdminPetsJs.signOut()">Sign out</button>
</header>
<aside class="pt-side" id="pt-nav" aria-label="Admin">
    <div class="pt-nav-top"><span>Menu</span><button type="button" class="pt-ibtn" aria-label="Close" onclick="AdminPetsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="pt-menu" id="pt-menu"></nav>
</aside>
<div class="pt-scrim" id="pt-scrim" onclick="AdminPetsJs.closeNav()"></div>
<main class="pt-amain" id="pt-main"><p class="pt-loading">Loading&hellip;</p></main>
<div class="pt-modal" id="pt-modal" onclick="if(event.target===this)AdminPetsJs.closeModal()">
    <div class="pt-mbox" role="dialog" aria-modal="true"><button type="button" class="pt-ibtn pt-mclose" aria-label="Close" onclick="AdminPetsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="pt-mbody"></div></div>
</div>
<div class="pt-toast" id="pt-toast" role="status" aria-live="polite"></div>
</div>
