<div class="rb-site rb-admin" id="rb-site" data-theme="light" style="{plhd_style}">
<header class="rb-ahead">
    <button type="button" class="rb-ibtn rb-burger" aria-label="Menu" onclick="AdminRoomBoardJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="rb-abrand" href="Admin"><svg class="rb-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--rb-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="rb-demo" id="rb-demo">{plhd_demo}</span>
    <span class="rb-grow"></span>
    <a class="rb-who" id="rb-who" href="AdminAccount"></a>
    <a class="rb-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="rb-out" onclick="AdminRoomBoardJs.signOut()">Sign out</button>
</header>
<aside class="rb-side" id="rb-nav" aria-label="Admin">
    <div class="rb-nav-top"><span>Menu</span><button type="button" class="rb-ibtn" aria-label="Close" onclick="AdminRoomBoardJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="rb-menu" id="rb-menu"></nav>
</aside>
<div class="rb-scrim" id="rb-scrim" onclick="AdminRoomBoardJs.closeNav()"></div>
<main class="rb-amain" id="rb-main"><p class="rb-loading">Loading&hellip;</p></main>
<div class="rb-modal" id="rb-modal" onclick="if(event.target===this)AdminRoomBoardJs.closeModal()">
    <div class="rb-mbox" role="dialog" aria-modal="true"><button type="button" class="rb-ibtn rb-mclose" aria-label="Close" onclick="AdminRoomBoardJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rb-mbody"></div></div>
</div>
<div class="rb-toast" id="rb-toast" role="status" aria-live="polite"></div>
</div>
