<div class="hr-site hr-admin" id="hr-site" data-qt="{plhd_qt}" data-theme="light" style="{plhd_style}">
<header class="hr-ahead">
    <button type="button" class="hr-ibtn hr-burger" aria-label="Menu" onclick="AdminHoursJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="hr-abrand" href="Admin"><svg class="hr-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--hr-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="hr-demo" id="hr-demo">{plhd_demo}</span>
    <span class="hr-grow"></span>
    <a class="hr-who" id="hr-who" href="AdminAccount"></a>
    <a class="hr-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="hr-out" onclick="AdminHoursJs.signOut()">Sign out</button>
</header>
<aside class="hr-side" id="hr-nav" aria-label="Admin">
    <div class="hr-nav-top"><span>Menu</span><button type="button" class="hr-ibtn" aria-label="Close" onclick="AdminHoursJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="hr-menu" id="hr-menu"></nav>
</aside>
<div class="hr-scrim" id="hr-scrim" onclick="AdminHoursJs.closeNav()"></div>
<main class="hr-amain" id="hr-main"><p class="hr-loading">Loading&hellip;</p></main>
<div class="hr-modal" id="hr-modal" onclick="if(event.target===this)AdminHoursJs.closeModal()">
    <div class="hr-mbox" role="dialog" aria-modal="true"><button type="button" class="hr-ibtn hr-mclose" aria-label="Close" onclick="AdminHoursJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="hr-mbody"></div></div>
</div>
<div class="hr-toast" id="hr-toast" role="status" aria-live="polite"></div>
</div>
