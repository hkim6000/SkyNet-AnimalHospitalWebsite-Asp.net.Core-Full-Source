<div class="ts-site ts-admin" id="ts-site" data-theme="light" style="{plhd_style}">
<header class="ts-ahead">
    <button type="button" class="ts-ibtn ts-burger" aria-label="Menu" onclick="AdminTestsJs.openNav()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="ts-abrand" href="Admin"><svg class="ts-logo" viewBox="0 0 40 40" width="34" height="34" aria-hidden="true"><rect width="40" height="40" rx="12" fill="var(--ts-accent)"/><ellipse cx="20" cy="25.5" rx="6.6" ry="5.6" fill="#fff"/><ellipse cx="11.6" cy="18.4" rx="2.7" ry="3.4" transform="rotate(-18 11.6 18.4)" fill="#fff"/><ellipse cx="16.6" cy="12.6" rx="2.8" ry="3.6" transform="rotate(-6 16.6 12.6)" fill="#fff"/><ellipse cx="23.4" cy="12.6" rx="2.8" ry="3.6" transform="rotate(6 23.4 12.6)" fill="#fff"/><ellipse cx="28.4" cy="18.4" rx="2.7" ry="3.4" transform="rotate(18 28.4 18.4)" fill="#fff"/></svg><b>{plhd_name}</b><small>Admin</small></a>
    <span class="ts-demo" id="ts-demo">{plhd_demo}</span>
    <span class="ts-grow"></span>
    <a class="ts-who" id="ts-who" href="AdminAccount"></a>
    <a class="ts-view" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="ts-out" onclick="AdminTestsJs.signOut()">Sign out</button>
</header>
<aside class="ts-side" id="ts-nav" aria-label="Admin">
    <div class="ts-nav-top"><span>Menu</span><button type="button" class="ts-ibtn" aria-label="Close" onclick="AdminTestsJs.closeNav()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <nav class="ts-menu" id="ts-menu"></nav>
</aside>
<div class="ts-scrim" id="ts-scrim" onclick="AdminTestsJs.closeNav()"></div>
<main class="ts-amain" id="ts-main"><p class="ts-loading">Loading&hellip;</p></main>
<div class="ts-modal" id="ts-modal" onclick="if(event.target===this)AdminTestsJs.closeModal()">
    <div class="ts-mbox" role="dialog" aria-modal="true"><button type="button" class="ts-ibtn ts-mclose" aria-label="Close" onclick="AdminTestsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="ts-mbody"></div></div>
</div>
<div class="ts-toast" id="ts-toast" role="status" aria-live="polite"></div>
</div>
